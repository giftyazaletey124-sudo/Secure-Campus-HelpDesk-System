<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Campus HelpDesk</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <section class="auth-container">

        <div class="auth-card">

            <h1>Create Your Account</h1>

            <p>Join the University IT Support Portal.</p>

            <!-- Display system messages -->
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            {% for message in messages %}
            <div class="flash-message">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <!-- Registration Form -->
            <form method="POST" action="{{ url_for('main.register') }}">

                <label>Full Name</label>

                <input type="text" name="full_name" placeholder="Enter your full name" required>

                <label>Email Address</label>

                <input type="email" name="email" placeholder="Enter your university email" required>

                <label>Password</label>

                <input type="password" name="password" placeholder="Create a password" minlength="12" required>

                <label>Account Type</label>

                <select name="role" required>

                    <option value="">Select account type</option>

                    <option value="student">Student</option>

                    <option value="staff">Staff</option>

                </select>

                <button type="submit" class="primary-btn">
                    Create Account
                </button>

            </form>

            <p class="auth-link">
                Already have an account?
                <a href="{{ url_for('main.login') }}">Login</a>
            </p>

        </div>

    </section>

</body>

</html>
