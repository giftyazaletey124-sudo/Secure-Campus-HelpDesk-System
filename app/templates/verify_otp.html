<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #173b65;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        input {
            width: 90%;
            padding: 13px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 20px;
            text-align: center;
            letter-spacing: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #104d80;
        }

        .flash {
            color: #c0392b;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Two-Factor Authentication</h2>

        <p>
            Open Google Authenticator and enter
            the six-digit verification code.
        </p>

        {% with messages = get_flashed_messages() %}
        {% for message in messages %}
        <p class="flash">{{ message }}</p>
        {% endfor %}
        {% endwith %}

        <form method="POST">

            <input type="text" name="otp_code" placeholder="000000" maxlength="6" pattern="[0-9]{6}" inputmode="numeric"
                autocomplete="one-time-code" required>

            <button type="submit">
                Verify and Login
            </button>

        </form>

    </div>

</body>

</html>
